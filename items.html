<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>준비물 · 웨딩 촬영 안내</title><link rel="stylesheet" href="style.css"></head>
<body data-page="items.html"><main>
<header><h1>🎒 준비물</h1><p>체크하면 이 기기에 저장돼요</p></header>
<section class="chk"><h2>👰 신부님</h2>
<label><input type="checkbox" data-k="i1"><span><b>니플패치</b><br><span class="sub">누브라보다 상체 라인이 잘 잡히고 위생적이에요. 누브라는 이모님이 챙겨 오세요</span></span></label>
<label><input type="checkbox" data-k="i2"><span><b>스킨톤 심리스 이너</b> (하의)<br><span class="sub">보정속옷은 개인 준비 목록에서 체크해 주세요</span></span></label>
<label><input type="checkbox" data-k="i3"><span><b>진주 자석 이어링</b></span></label>
<label><input type="checkbox" data-k="i4"><span><b>큐빅 자석 이어링</b><br><span class="sub">드레스샵에서도 기본 제공하니 당일에 써도, 안 써도 돼요</span></span></label>
<label><input type="checkbox" data-k="i5"><span><b>구두</b> (앞코 예쁜 것)</span></label>
<label><input type="checkbox" data-k="i6"><span><b>헤어 캡처 사진</b> (드레스별)</span></label>
<label><input type="checkbox" data-k="i7"><span>톤업크림 (선택)<br><span class="sub">목은 샵에서 해 주시고, 팔 톤업크림은 마무리 때 요청하면 발라 줘요. 바른 뒤 신랑 정장에 묻을 수 있으니 조심하세요</span></span></label></section>
<section class="chk"><h2>💐 여자친구 담당</h2>
<label><input type="checkbox" data-k="i8"><span><b>오일파스텔 그림</b></span></label>
<label><input type="checkbox" data-k="i9"><span><b>생화 부케</b></span></label>
</section>
<section class="chk"><h2>🤵 신랑님</h2>
<label><input type="checkbox" data-k="g1"><span><b>장목 양말 (긴 검정 양말)</b><br><span class="sub">앉아도 발목이 보이지 않을 길이로요</span></span></label>
<label><input type="checkbox" data-k="g2"><span><b>구두 블랙·갈색</b> + 양말 블랙·갈색 세트</span></label>
<label><input type="checkbox" data-k="g3"><span><b>셔츠</b> 있는지 전날 확인</span></label></section>
<section class="chk"><h2>🎀 촬영 소품 (5개 이하)</h2>
<label><input type="checkbox" data-k="p1"><span>커플링</span></label>
<label><input type="checkbox" data-k="p2"><span>비눗방울</span></label>
<label><input type="checkbox" data-k="p3"><span>미니케익 · 폴라로이드 카메라</span></label>
<label><input type="checkbox" data-k="p4"><span>선글라스 · 끈리본 · 어린 시절 사진</span></label>
<label><input type="checkbox" data-k="p5"><span>풍선 · 컨페티</span></label>
<label><input type="checkbox" data-k="p6"><span>찻잔 (선택 · 필요 없으면 제외)</span></label>
<div class="note">개수 제한은 없지만 소품 없이 부케만 든 컷도 예뻐서 5개 이하를 추천해요.</div></section>
<section class="chk"><h2>🍫 간식 · 음료</h2>
<label><input type="checkbox" data-k="f1"><span>당류 초콜릿·과자, 마실 것</span></label>
<label><input type="checkbox" data-k="f2"><span>먹기 편한 김밥·커피 (배달 이용)</span></label>
<label><input type="checkbox" data-k="f4"><span>젤리</span></label>
<label><input type="checkbox" data-k="f5"><span>과일</span></label>
<label><input type="checkbox" data-k="f6"><span>한입 단백질 바</span></label>
<label><input type="checkbox" data-k="f7"><span>빨대</span></label>
<label><input type="checkbox" data-k="f8"><span>생수</span></label>
</section>
<section class="chk"><h2>🧳 공용 준비물 · 차량</h2>
<label><input type="checkbox" data-k="f9"><span><b>헬퍼비 50만원 준비</b><br><span class="sub">챙겨갈 금액이에요. 최종 정산은 추가 비용에 따라 확인해요.</span></span></label>
<label><input type="checkbox" data-k="f10"><span>손난로</span></label>
<label><input type="checkbox" data-k="f11"><span>물티슈</span></label>
<label><input type="checkbox" data-k="f12"><span>휴지</span></label>
<label><input type="checkbox" data-k="f13"><span>이동용 슬리퍼 2개</span></label>
<label><input type="checkbox" data-k="f14"><span>담요</span></label>
<label><input type="checkbox" data-k="f3"><span>이모님 자리 + 트렁크 비우기</span></label>
</section>
<section class="chk"><h2>👔 개인 준비</h2>
<label><input type="checkbox" data-k="u1"><span>예복</span></label>
<label><input type="checkbox" data-k="u2"><span>셋업</span></label>
<label><input type="checkbox" data-k="u3"><span>니트</span></label>
<label><input type="checkbox" data-k="u5"><span>속옷</span></label>
<label><input type="checkbox" data-k="u6"><span>보정속옷</span></label>
<label><input type="checkbox" data-k="u7"><span>렌즈</span></label>
<label><input type="checkbox" data-k="u8"><span>셀카봉</span></label>
<label><input type="checkbox" data-k="u9"><span>거치대</span></label>
</section>
</main><script src="app.js"></script></body></html>

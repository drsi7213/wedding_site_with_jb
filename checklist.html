<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>체크리스트 · 웨딩 촬영 안내</title><link rel="stylesheet" href="style.css"></head>
<body data-page="checklist.html"><main>
<header><h1>✅ 체크리스트</h1><p>체크하면 이 기기에 저장돼요</p></header>
<section class="chk"><h2>📅 미리 준비</h2>
<label><input type="checkbox" data-k="a1"><span>드레스별로 하고 싶은 헤어 사진 캡처</span></label>
<label><input type="checkbox" data-k="a2"><span>헤어 담당 부원장님께 헤어 스타일 전달</span></label>
<label><input type="checkbox" data-k="a3"><span>로드 드레스 고민해서 정하기</span></label>
<label><input type="checkbox" data-k="a4"><span>촬영부케 플래너님과 상의 (다음 주, 당일 오전 메이크업샵으로 배송)</span></label>
<label><input type="checkbox" data-k="a5"><span>촬영 소품 5개 이하로 고르기</span></label>
<label><input type="checkbox" data-k="a6"><span>시안 페이지 완성해서 작가님께 공유</span></label></section>
<section class="chk"><h2>🗓 전날 (11/17)</h2>
<label><input type="checkbox" data-k="b1"><span>신랑 예복에 셔츠가 포함되어 있는지 확인</span></label>
<label><input type="checkbox" data-k="b2"><span>당류 초콜릿·과자 장보기, 음료·간식 준비</span></label>
<label><input type="checkbox" data-k="b3"><span>헬퍼이모님 배정 연락·연락처 받았는지 확인</span></label>
<label><input type="checkbox" data-k="b4"><span>차량 트렁크 비우기 (이모님 자리와 캐리어 공간)</span></label>
<label><input type="checkbox" data-k="b5"><span>준비물 페이지 전부 챙겼는지 확인</span></label>
<label><input type="checkbox" data-k="b6"><span>푹 쉬기 😴</span></label></section>
<section class="chk"><h2>🌅 당일</h2>
<label><input type="checkbox" data-k="c1"><span>09:00 드이희 방문</span></label>
<label><input type="checkbox" data-k="c2"><span>메이크업샵에서 푼 웨이브 + 첫 드레스</span></label>
<label><input type="checkbox" data-k="c3"><span>스튜디오 이동 시 음료 배달 주문</span></label>
<label><input type="checkbox" data-k="c4"><span>13:00 스튜디오 비비 도착, 작가님과 미팅</span></label>
<label><input type="checkbox" data-k="c5"><span>촬영 2시간쯤 지나면 간식 타임</span></label></section>
<section class="chk"><h2>🏁 촬영 후</h2>
<label><input type="checkbox" data-k="d1"><span>신랑·신부 예복 반납</span></label>
<label><input type="checkbox" data-k="d2"><span>이모님 드레스샵까지 모셔다 드리기 (또는 택시비)</span></label>
<label><input type="checkbox" data-k="d3"><span>헬퍼이모님 비용 정산</span></label></section>
<section><h2>💸 헬퍼이모님 비용</h2><table>
<tr><td>기본</td><td>25만원</td></tr><tr><td>벌수 추가</td><td>5만원</td></tr>
<tr><td>청담 외 지역</td><td>5만원</td></tr><tr><td>야외 촬영</td><td>5만원</td></tr>
<tr class="total"><td>합계</td><td>40만원</td></tr></table>
<div class="note">촬영이 5시간 이상이면 5만원 추가예요.</div></section>
</main><script src="app.js"></script></body></html>
